name: zzz public components

# Every job declares a cost tier and a whole-minute budget. The `changes`
# gate skips build/test work for drafts and licence-only changes.
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: drafts skip the build job, so a PR that is drafted and
    # then marked ready must be able to start a run.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails OPEN: anything that cannot compute a diff (first push of a branch,
  # API error, empty result) classifies as a code change. A gate that guesses
  # "nothing changed" is a silent hole; one that guesses "everything" is a bill.
  changes:
    runs-on: ubuntu-latest
    env:
      CI_TIER: fast
      CI_BUDGET_MIN: '1'
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -eu
          if [ "$IS_DRAFT" = true ]; then
            echo "::notice::draft pull request — build job skipped. Mark it ready for review to run it."
            echo code=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            files=__ALL__
          else
            files=$(gh api --paginate "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
              --jq '.files[].filename' 2>/dev/null) || files=__ALL__
            [ -n "$files" ] || files=__ALL__
          fi
          # Licence text cannot change a build or test result. Markdown can:
          # the repository tests check documented build steps and references.
          if [ "$files" != __ALL__ ] && ! printf '%s\n' "$files" | grep -qvE '^(LICENSE|NOTICE)$'; then
            echo "::notice::licence-only change — build job skipped."
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI_TIER: fast
      # Per matrix leg. No hosted run exists yet: replace this with the first
      # real run's duration.
      CI_BUDGET_MIN: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # .zigversion is the single toolchain pin; the repository tests
      # fail on any other compiler.
      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - run: zig build ci -Doptimize=ReleaseSafe
